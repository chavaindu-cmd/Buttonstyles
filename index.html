<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/index.css">
    <title>ButtonStyles</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Burger Menu</a>

            <input type="checkbox" id="menu-toggle">

            <label for="menu-toggle" class="burger">☰</label>

            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

        <nav class="dropdown">
            <a href="index.html" class="logo">Drop Down</a>

            <input type="checkbox" id="menu-toggle1">

            <label for="menu-toggle1" class="burger">Open</label>

            <ul class="dropdown-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

        <nav class="overlay">

            <a href="index.html" class="logo">Overlay</a>

            <input type="checkbox" id="menu-toggle2">

            <label for="menu-toggle2" class="overlay-button">☰</label>

            <ul class="overlay-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>

        </nav>

        <nav class="side-menu">
            <a href="index.html" class="logo">Side</a>
            <input type="checkbox" id="side-toggle">

            <label for="side-toggle" class="side-button">☰</label>

            <div class="side-overlay">

                <label for="side-toggle" class="close-button">×</label>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>

            </div>

        </nav>
    </header>
    
</body>
</html>
